<header class="view-title"><h1>Tell us about yourself</h1><p>Step 1 of 5 · Basics and experience</p></header>
<div class="progress"><i style="width:33%"></i></div>
<form class="profile-card" [formGroup]="form" (ngSubmit)="submit()">
  <label class="wide"><span>Professional headline <b class="required">*</b></span><input required formControlName="headline" placeholder="Full-stack Developer">@if(form.controls.headline.touched && form.controls.headline.invalid){<em class="field-error">Professional headline is required.</em>}</label>
  <label><span>Experience level <b class="required">*</b></span><select required formControlName="experienceLevel"><option value="">Select experience</option><option>Entry-level (0–2 years)</option><option>Mid-level (3–5 years)</option><option>Senior (6+ years)</option></select>@if(form.controls.experienceLevel.touched && form.controls.experienceLevel.invalid){<em class="field-error">Experience level is required.</em>}</label>
  <label><span>Education <b class="required">*</b></span><input required formControlName="education" placeholder="Bachelor's degree">@if(form.controls.education.touched && form.controls.education.invalid){<em class="field-error">Education is required.</em>}</label>
  <label class="wide"><span>Current role <b class="required">*</b></span><input required formControlName="currentRole" placeholder="Software Engineer">@if(form.controls.currentRole.touched && form.controls.currentRole.invalid){<em class="field-error">Current role is required.</em>}</label>
  <label class="wide"><span>Skills <b class="required">*</b> <small>Separate skills with commas</small></span><input required formControlName="skills" placeholder=".NET, Angular, SQL Server, React">@if(form.controls.skills.touched && form.controls.skills.invalid){<em class="field-error">Add at least one skill.</em>}</label>
  <button type="submit">Save and continue</button>
</form>
