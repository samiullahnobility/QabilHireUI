<header class="view-title"><h1>Tell us about yourself</h1><p>Step 1 of 5 · Basics and experience</p></header><div class="progress"><i style="width:33%"></i></div><form class="profile-card" [formGroup]="form" (ngSubmit)="submit()"><label class="wide">Professional headline<input formControlName="headline" placeholder="Full-stack Developer"></label><label>Experience level<select formControlName="experienceLevel"><option value="">Select experience</option><option>Entry-level (0–2 years)</option><option>Mid-level (3–5 years)</option><option>Senior (6+ years)</option></select></label><label>Education<input formControlName="education" placeholder="Bachelor's degree"></label><label class="wide">Current role<input formControlName="currentRole" placeholder="Software Engineer"></label><label class="wide">Skills <small>Separate skills with commas</small><input formControlName="skills" placeholder=".NET, Angular, SQL Server, React"></label><button type="submit">Save and continue</button></form>
