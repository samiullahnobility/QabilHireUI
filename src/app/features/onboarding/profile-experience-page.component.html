<header class="view-title"><h1>Share your experience</h1><p>Step 2 of 5 · Professional experience</p></header><div class="progress"><i style="width:40%"></i></div><form class="profile-card compact" [formGroup]="form" (ngSubmit)="submit()"><label class="wide">Most recent company<input formControlName="company" placeholder="Company or organization"></label><label class="wide">Key responsibilities<textarea formControlName="responsibilities" placeholder="Describe the work most relevant to your target role"></textarea></label><label class="wide">Proudest achievement<textarea formControlName="achievement" placeholder="Example: Improved API response time by 35%"></textarea></label><div class="form-actions wide"><button class="secondary" type="button" (click)="back()">Back</button><button class="primary" type="submit">Save and continue</button></div></form>
