<header class="view-title"><h1>Education &amp; experience</h1><p>Build context for personalized interview questions</p></header><div class="progress"><i style="width:40%"></i></div><p class="step-label">Step 2 of 5</p><form class="profile-card education-card" [formGroup]="form" (ngSubmit)="submit()"><h2 class="wide">Education</h2><label>Degree<input formControlName="qualification" placeholder="BS Computer Science"></label><label>Institution<input formControlName="institution" placeholder="University name"></label><label>Graduation year<input formControlName="graduationYear" placeholder="2022"></label><h2 class="wide">Work experience</h2><label>Company<input formControlName="company" placeholder="Insignia Software"></label><label>Role<input formControlName="currentRole" placeholder="Software Engineer"></label><label>Duration<input formControlName="experienceDuration" placeholder="3 years"></label><label class="wide">Key achievements<input formControlName="achievement" placeholder="Built APIs and data-intensive workflows"></label><div class="form-actions wide"><button class="secondary" type="button" (click)="back()">Back</button><button class="primary" type="submit">Save and continue</button></div></form>
