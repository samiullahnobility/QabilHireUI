<header class="view-title"><h1>Skills and expertise</h1><p>Select skills the AI should use for analysis and interviews</p></header><div class="progress"><i style="width:60%"></i></div><p class="step-label">Step 3 of 5</p><section class="skills-page"><input class="skill-search" type="search" placeholder="Search skills..." [value]="search()" (input)="search.set($any($event.target).value)"><h2>Selected skills</h2><div class="skill-grid">@for(skill of filteredSkills();track skill){<button type="button" [class.selected]="selected.has(skill)" (click)="toggle(skill)">{{skill}}</button>}</div><h2>Experience level</h2><div class="level-grid">@for(item of levels;track item){<button type="button" [class.selected]="level()===item" (click)="chooseLevel(item)"><strong>{{item}}</strong><small>{{item==='Learning'?'< 1 year':item==='Working knowledge'?'1–2 years':item==='Proficient'?'3–5 years':'5+ years'}}</small></button>}</div><article class="suggested"><h2>Suggested from resume</h2>@for(item of suggested;track item){<button type="button" (click)="toggle(item)">{{item}}</button>}</article><div class="form-actions"><button class="secondary" type="button" (click)="back()">Back</button><button class="primary" type="button" (click)="submit()">Save and continue</button></div></section>
