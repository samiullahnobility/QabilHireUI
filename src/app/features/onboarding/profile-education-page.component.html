<header class="view-title"><h1>Add education and links</h1><p>Step 3 of 5 · Education and professional presence</p></header><div class="progress"><i style="width:60%"></i></div><form class="profile-card compact" [formGroup]="form" (ngSubmit)="submit()"><label>Institution<input formControlName="institution" placeholder="University or institute"></label><label>Qualification<input formControlName="qualification" placeholder="Degree or certification"></label><label class="wide">LinkedIn profile <small>Optional</small><input type="url" formControlName="linkedInUrl" placeholder="https://linkedin.com/in/..."></label><label class="wide">Portfolio or GitHub <small>Optional</small><input type="url" formControlName="portfolioUrl" placeholder="https://github.com/..."></label><div class="form-actions wide"><button class="secondary" type="button" (click)="back()">Back</button><button class="primary" type="submit">Save and continue</button></div></form>
