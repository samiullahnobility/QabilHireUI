<header class="view-title"><h1>Define your career direction</h1><p>Step 4 of 5 · Role and interview preferences</p></header><div class="progress"><i style="width:80%"></i></div><form class="profile-card compact" [formGroup]="form" (ngSubmit)="submit()"><label>Target role<input formControlName="targetRole" placeholder="Senior Full-stack Developer"></label><label>Industry<input formControlName="industry" placeholder="SaaS / Business Software"></label><label>Location<input formControlName="location" placeholder="Remote / Islamabad"></label><fieldset class="wide"><legend>Interview preferences</legend><div class="chips">@for(option of options;track option){<button type="button" [class.selected]="selected.has(option)" (click)="toggle(option)">{{option}}</button>}</div></fieldset><label class="wide">Career goal<input formControlName="careerGoal" placeholder="Prepare for senior engineering roles"></label><div class="form-actions wide"><button class="secondary" type="button" (click)="back()">Back</button><button class="primary" type="submit">Review profile</button></div></form>
