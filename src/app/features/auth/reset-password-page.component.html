<main class="auth"><aside class="visual"><div class="visual-content"><h2>Practice smarter.<br>Improve faster.<br>Interview with confidence.</h2><p>AI-guided resume analysis, job matching, adaptive interviews, and personalized improvement.</p></div></aside><section class="form-side"><div class="panel"><h1>Create a new password</h1><p class="intro">Choose a secure password for your QabilHire account.</p><form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline"><mat-label>New password</mat-label><input matInput type="password" formControlName="password" placeholder="Enter new password"></mat-form-field><mat-form-field appearance="outline"><mat-label>Confirm password</mat-label><input matInput type="password" formControlName="confirmPassword" placeholder="Repeat password"></mat-form-field><button class="submit" mat-flat-button type="submit" [disabled]="submitting()">{{ submitting() ? 'Resetting...' : 'Reset password' }}</button></form></div></section></main>
